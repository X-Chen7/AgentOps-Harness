repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
      - id: ruff-format
  - repo: local
    hooks:
      - id: harness-check
        name: harness check
        entry: python -m harness check
        language: system
        pass_filenames: false
      - id: harness-push-gate
        name: harness push gate
        entry: python -m harness sync --push-gate
        language: system
        stages: [pre-push]
        pass_filenames: false
