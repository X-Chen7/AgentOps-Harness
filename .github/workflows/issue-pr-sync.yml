name: GitHub Sync

on:
  issues:
    types: [opened, edited, closed, reopened]
  pull_request_target:
    types: [opened, edited, closed, reopened, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: harness-github-sync
  cancel-in-progress: false

jobs:
  sync:
    if: |
      github.event_name != 'pull_request_target' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       !startsWith(github.event.pull_request.head.ref, 'harness-sync/'))
    env:
      GH_TOKEN: ${{ secrets.HARNESS_SYNC_TOKEN || github.token }}
      HARNESS_SYNC_TRANSPORT: ${{ secrets.HARNESS_SYNC_TOKEN != '' && 'direct' || 'pr' }}
      GITHUB_EVENT_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || 'manual' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Configure git bot identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Configure git bot auth
        if: env.HARNESS_SYNC_TOKEN != ''
        run: gh auth setup-git
      - name: Sync GitHub state
        run: |
          python -m harness github sync --apply --transport "$HARNESS_SYNC_TRANSPORT"
