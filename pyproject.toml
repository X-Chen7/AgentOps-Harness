[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentops-harness"
version = "0.1.0"
description = "Executable AgentOps multi-agent harness CLI"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
harness = "harness.cli:main"

[tool.setuptools.packages.find]
include = ["harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
